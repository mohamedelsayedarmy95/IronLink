name: CI

# Runs on every pull request, and on main after merge.
#
# The repository had no test workflow at all: 765 tests existed and none of
# them ran anywhere except a developer's machine. That is the same failure mode
# as the Smart Keyword Alert bugs this suite now guards against — code that
# nobody had actually executed, believed to work because nothing said otherwise.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the first. Reviewing a run for a
# commit that has already been replaced is wasted attention.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A note on pinning, since the two kinds of dependency here are pinned
# differently on purpose.
#
# Action majors float (@v7). A major is a stable input contract, and letting
# patches arrive is how Node runtime deprecations get picked up instead of
# accumulating — GitHub flagged Node 20 on the previous versions of these, and
# nothing would have surfaced that except a run.
#
# The Flutter version does not float. A toolchain that moves on its own turns
# an unrelated pull request red and sends its author hunting a bug they did not
# write. Bump it deliberately, everywhere it appears.

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # matches the Dockerfile base image
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No Redis or Postgres service here on purpose. The suite uses fakes
      # (tests/fakes.py) rather than live infrastructure, which is what keeps
      # it fast and what lets it assert on failure paths — an unreachable Redis
      # is a case worth testing, and it is easier to fake than to arrange.
      - name: Run tests
        run: python -m pytest tests/ -q

  backend-image:
    name: Backend (image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Render builds this same Dockerfile on every push to the deploy branch.
      # Finding out here that it no longer builds is better than finding out
      # from a failed deploy, where the running service stays on the old image
      # with no obvious reason why.
      - name: Build image
        run: docker build -t ironlink-backend:ci .

  frontend:
    name: Frontend (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Two passes with different bars, because the repository has pre-existing
      # lint debt that is not this workflow's business to fail over.
      #
      # Repository-wide: infos are tolerated (39 of them today, all in code
      # that predates this suite), while any *warning* or *error* fails. Every
      # warning was cleared to make that bar real, and two of them turned out
      # to be bugs. Do not weaken this to --no-fatal-warnings; clear the
      # warning instead.
      - name: Analyze (repository, warnings and errors fatal)
        run: flutter analyze --no-fatal-infos

      # And a strict pass over the code written against the Smart Keyword Alert
      # specification, which is clean and must stay clean. If this starts
      # failing, something was added below the standard the rest of it holds.
      - name: Analyze (keyword alert, strict)
        run: flutter analyze lib/features/keyword_alert test/keyword_alert

      - name: Run tests
        run: flutter test

  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The real google-services.json is gitignored, so a runner has none, and
      # the Google Services Gradle plugin refuses to configure the project
      # without it: "File google-services.json is missing." That single missing
      # file was enough to keep the whole native surface of this app unverified.
      - name: Put a placeholder Firebase config in place
        run: cp android/app/google-services.ci.json android/app/google-services.json

      # THIS JOB IS WHY THE OTHERS ARE NOT ENOUGH.
      #
      # The app depends on native plugins — ML Kit text recognition, the
      # Syncfusion PDF reader, Firebase — and until this job existed none of
      # them had been through an Android build in CI. Unit tests cannot reach a
      # platform channel, so the entire native surface was unverified.
      #
      # A release build rather than debug, deliberately: R8 shrinking is where
      # native plugins break, by stripping classes reached only reflectively.
      # A debug build would pass and say nothing about the configuration that
      # actually ships.
      #
      # Signing uses the debug key, because android/app/build.gradle still says
      # so — there is no release keystore in this repository. That is a real gap
      # for shipping and no obstacle to verifying the build.
      #
      # API_BASE_URL must include the /api/v1 prefix; WS_BASE_URL must not,
      # since the WebSocket routes are mounted at the application root.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://ironlink-api.onrender.com/api/v1 \
            --dart-define=WS_BASE_URL=wss://ironlink-api.onrender.com

      # No artifact upload, deliberately. This APK has a placeholder Firebase
      # config baked into it: it would look like a working build and fail at
      # sign-in, and someone would lose an afternoon to that. This job answers
      # "does it build", which is the question that was unanswered. Build the
      # shippable APK where the real config lives.
      - name: Report what was verified
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          size=$(stat -c%s "$apk")
          echo "::notice::Release APK built: $((size / 1048576)) MB. Compilation, R8 and asset bundling verified; Firebase config is a placeholder, so nothing network-facing was."
