name: ironlink
description: IronLink — secure enterprise messaging.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2   # tokens NEVER in SharedPreferences
  web_socket_channel: ^3.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^16.3.0
  image_picker: ^1.1.2
  record: ^5.1.2                   # hold-to-record voice notes
  just_audio: ^0.9.34              # audio playback
  audio_waveforms: ^2.0.0          # waveform visualization
  flutter_ffmpeg: ^0.4.4           # audio compression
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true