name: ironlink
description: IronLink — secure enterprise messaging.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2   # tokens NEVER in SharedPreferences
  flutter_ffmpeg: ^0.4.2           # audio compression
  web_socket_channel: ^3.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^16.3.0
  image_picker: ^1.1.2
  record: ^5.1.2                   # hold-to-record voice notes
  just_audio: ^0.9.34              # audio playback
  audio_waveforms: ^2.0.0          # waveform visualization
  path_provider: ^2.1.4
  libsignal_protocol_dart: ^0.8.2  # Signal Protocol for E2EE
  google_fonts: ^6.2.0             # Google Fonts for beautiful typography

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"