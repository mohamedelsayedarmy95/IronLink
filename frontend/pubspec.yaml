name: ironlink
description: IronLink — secure enterprise messaging.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2   # tokens NEVER in SharedPreferences
  web_socket_channel: ^3.0.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1            # Firebase Phone Auth — real SMS verification
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^19.0.0
  image_picker: ^1.1.2
  record: ^6.0.0                   # hold-to-record voice notes
  just_audio: ^0.9.34              # audio playback
  path_provider: ^2.1.4
  libsignal_protocol_dart: ^0.8.2  # Signal Protocol for E2EE
  google_fonts: ^6.2.0             # Google Fonts for beautiful typography
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  lucide_icons_flutter: ^3.1.15
  flutter_contacts: ^2.3.1
  crypto: ^3.0.7
  # AES-GCM for attachment encryption. Already present transitively via
  # libsignal, declared here because we import it directly.
  pointycastle: ^4.0.0
  sqflite: ^2.4.3                  # local message cache, powers offline + search
  google_mlkit_text_recognition: ^0.16.0

  # Vendored, not published. The pub release calls jcenter() in its Gradle
  # script, which Gradle removed — see packages/flutter_tesseract_ocr/VENDORING.md.
  flutter_tesseract_ocr:
    path: packages/flutter_tesseract_ocr
  syncfusion_flutter_pdf: ^33.2.13
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.4.1
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/intro/
    # Tesseract's Arabic model. Arabic only: ML Kit covers Latin, and
    # Tesseract's own English data is 22 MB for no gain here.
    - assets/tessdata/
    - assets/tessdata_config.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icons/icon_android.png"
  image_path_ios: "assets/icons/icon_ios.png"

# Native splash — drawn by the OS before Flutter starts, so it appears
# instantly with no black frame. Regenerate after changing anything here:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # Matches IronColors.backgroundPrimary in lib/core/theme.dart, so the
  # handover from splash to first screen has no colour jump.
  color: "#0A0C10"
  image: assets/intro/splash_logo.png

  # Android 12+ ignores the legacy splash and masks the icon to a circle,
  # cropping to roughly the inner two-thirds — hence a separate, inset asset.
  android_12:
    color: "#0A0C10"
    image: assets/intro/splash_logo_android12.png

  android: true
  ios: true
  web: false