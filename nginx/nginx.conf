worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options            "DENY"                    always;
    add_header X-Content-Type-Options     "nosniff"                 always;
    add_header X-XSS-Protection           "1; mode=block"           always;
    add_header Referrer-Policy            "no-referrer"             always;
    add_header Permissions-Policy         "geolocation=()"          always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy    "default-src 'self'; connect-src 'self' wss:; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 75s;
    gzip off;   # Off on TLS to prevent BREACH

    # ── Rate limiting ─────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=ws_limit:5m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Logging ───────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time"';

    access_log /var/log/nginx/access.log main;

    # ── HTTP → HTTPS redirect ──────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS / TLS 1.3 main server ───────────────────────────────
    server {
        listen 443 ssl http2 default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # TLS 1.3 ONLY — no 1.2 fallback for military-grade security
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:MozSSL:10m;
        ssl_session_tickets off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;

        client_max_body_size 50M;
        limit_conn conn_limit 20;

        # ── API endpoints ─────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass         http://ironlink_api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── WebSocket endpoint ────────────────────────────────────
        location /ws/ {
            limit_req zone=ws_limit burst=20 nodelay;

            proxy_pass         http://ironlink_api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;  # 24h for persistent WS connections
        }

        # ── Health check (unauthenticated, internal use) ──────────
        location /health {
            proxy_pass http://ironlink_api:8000/health;
            access_log off;
        }
    }
}
