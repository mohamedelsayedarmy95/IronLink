# IronLink — Infrastructure Stack
# TLS 1.3 enforced at Nginx layer; all inter-service traffic on an isolated bridge network.

networks:
  ironlink_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  pg_data:
  redis_data:
  minio_data:
  nginx_logs:

services:

  # ──────────────────────────────────────────────────────────────
  # PostgreSQL 16 — primary datastore
  # pgcrypto enabled for column-level encryption (AES via pgp_sym_encrypt)
  # ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ironlink_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_ADMIN_PASSWORD:?Set LOCAL_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-ironlink}
      MIGRATION_POSTGRES_USER: ${MIGRATION_POSTGRES_USER:-ironlink_owner}
      MIGRATION_POSTGRES_PASSWORD: ${MIGRATION_POSTGRES_PASSWORD:?Set MIGRATION_POSTGRES_PASSWORD}
      IRONLINK_RUNTIME_USER: ${POSTGRES_USER:-ironlink_user}
      IRONLINK_RUNTIME_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_local_roles.sh:/docker-entrypoint-initdb.d/00_roles.sh:ro
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      ironlink_net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-ironlink}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot runs initdb + init_db.sql; give it time before failures count.
      start_period: 60s
    # Fable5-Enhancement: explicit shared_buffers + wal_level for point-in-time recovery
    # readiness. WAL archiving can be turned on with a single env var in production without
    # rebuilding the image.
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c wal_level=replica
        -c max_connections=200
        -c log_connections=on
        -c log_disconnections=on
        -c log_duration=off
        -c log_min_duration_statement=1000
    ports:
      - "127.0.0.1:5432:5432"   # localhost-only; Nginx/API reach via internal network

  # ──────────────────────────────────────────────────────────────
  # Redis Stack — Pub/Sub + WebSocket session registry + OTP cache
  # Fable5-Enhancement: Redis Stack (not plain Redis) gives us RedisSearch for
  # fast user-lookup, RedisJSON for session blobs, and keyspace notifications for
  # self-destruct message TTL events — all in one image instead of three.
  # ──────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: ironlink_redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: >-
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --notify-keyspace-events KEx
        --bind 0.0.0.0
        --protected-mode no
    volumes:
      - redis_data:/data
    networks:
      ironlink_net:
        ipv4_address: 172.20.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  # ──────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage for attachments & avatars
  # Fable5-Enhancement: SSE-S3 server-side encryption enabled via env var
  # (MINIO_KMS_AUTO_ENCRYPTION=on) so every object is encrypted at rest without
  # requiring client-side changes. Pre-signed URLs expire in 15 min (enforced in
  # StorageService, not here) to prevent link sharing outside the app.
  # ──────────────────────────────────────────────────────────────
  minio:
    # The official minio/minio images are no longer anonymously pullable:
    # Docker Hub and Quay both return 401/access denied. elestio/minio is a
    # public MinIO build; pin its multi-arch digest for reproducibility.
    image: elestio/minio:latest@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    container_name: ironlink_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:            ${MINIO_ROOT_USER:-ironlink_minio}
      MINIO_ROOT_PASSWORD:        ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER:              "off"
      # Auto-encryption requires a configured KMS; without one MinIO exits
      # fatally at boot. Development runs without SSE-S3; a production
      # deployment must provide KMS settings before turning this back on.
      MINIO_KMS_AUTO_ENCRYPTION:  "off"
      MINIO_SITE_NAME:            "ironlink"
    volumes:
      - minio_data:/data
    networks:
      ironlink_net:
        ipv4_address: 172.20.0.12
    healthcheck:
      # The image ships curl; check the server directly instead of relying on
      # an mc alias being configured inside the container.
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # ──────────────────────────────────────────────────────────────
  # FastAPI application — served via Uvicorn workers
  # ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironlink_api
    restart: unless-stopped
    env_file: .env
    environment:
      MIGRATION_POSTGRES_USER: ${MIGRATION_POSTGRES_USER:-ironlink_owner}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      ironlink_net:
        ipv4_address: 172.20.0.20
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────────────────────────
  # Nginx — Reverse Proxy with TLS 1.3 only
  # Fable5-Enhancement: HSTS + OCSP stapling + security headers baked in.
  # HTTP/2 enabled for multiplexed WebSocket upgrades (h2 + wss on same port 443).
  # ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ironlink_nginx
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      ironlink_net:
        ipv4_address: 172.20.0.30
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
